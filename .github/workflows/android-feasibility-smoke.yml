name: Android feasibility smoke test

on:
  push:
    branches:
      - arena/d1c4a8ce-noit

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Build debug APK
        working-directory: feasibility/android-smoke
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: noit-android-smoke-debug-apk
          path: feasibility/android-smoke/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
